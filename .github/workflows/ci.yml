name: Test and package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[media]" pytest
      - run: python -m pytest -q
      - run: python -m subtitler demo --output demo-output
      - run: python -m subtitler evolve demo --output evolution-demo
      - run: python tools/build_skill.py
      - uses: actions/upload-artifact@v4
        with:
          name: skill-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
  core-install:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m venv core-env
      - name: Install and run in isolated environment
        shell: bash
        run: |
          if [ -f core-env/Scripts/python.exe ]; then PY="$PWD/core-env/Scripts/python.exe"; else PY="$PWD/core-env/bin/python"; fi
          "$PY" -m pip install .
          "$PY" -m pip check
          mkdir core-run
          cd core-run
          "$PY" -m subtitler doctor --core
          "$PY" -m subtitler evolve demo --output core-demo
